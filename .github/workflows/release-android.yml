name: Build Android APK

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-release-master
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      KHIE_BUILD_COMMIT: ${{ github.sha }}
      NODE_ENV: production

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  release:
    name: Build and publish APK
    needs: verify
    runs-on: ubuntu-latest
    environment: production-android-release
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      KHIE_BUILD_COMMIT: ${{ github.sha }}
      NODE_ENV: production

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Android project
        run: pnpm prebuild --platform android --no-install

      - name: Restore release signing key
        env:
          KHIE_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.KHIE_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          : "${KHIE_ANDROID_RELEASE_KEYSTORE_BASE64:?Missing Android release keystore}"
          key_file="$RUNNER_TEMP/khie-release.p12"
          umask 077
          printf '%s' "$KHIE_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          printf 'KHIE_RELEASE_STORE_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Read signing certificate fingerprint
        env:
          KHIE_RELEASE_PASSWORD: ${{ secrets.KHIE_ANDROID_RELEASE_PASSWORD }}
        run: |
          : "${KHIE_RELEASE_PASSWORD:?Missing Android release keystore password}"
          fingerprint="$(keytool -list -v -storetype PKCS12 -keystore "$KHIE_RELEASE_STORE_FILE" -storepass "$KHIE_RELEASE_PASSWORD" -alias khie-mobile-release 2>/dev/null | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print $2; exit}')"
          [[ "$fingerprint" =~ ^[A-F0-9]{64}$ ]]
          printf 'KHIE_SIGNING_CERT_SHA256=%s\n' "$fingerprint" >> "$GITHUB_ENV"

      - name: Build standalone release APK
        working-directory: android
        env:
          KHIE_RELEASE_PASSWORD: ${{ secrets.KHIE_ANDROID_RELEASE_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -Pkhie.enableAbiSplits=true
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64
          --no-daemon

      - name: Verify APK signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-universal-release.apk
          apk_fingerprint="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-universal-release.apk | awk -F': ' '/certificate SHA-256 digest:/{print toupper($NF); exit}')"
          [[ "$apk_fingerprint" =~ ^[A-F0-9]{64}$ ]]
          if [[ "$apk_fingerprint" != "$KHIE_SIGNING_CERT_SHA256" ]]; then
            printf 'APK signing certificate mismatch: expected %s, got %s\n' "$KHIE_SIGNING_CERT_SHA256" "$apk_fingerprint" >&2
            exit 1
          fi

      - name: Remove release signing key
        if: always()
        run: rm -f "$KHIE_RELEASE_STORE_FILE"

      - name: Prepare release assets
        shell: bash
        run: |
          RELEASE_VERSION="v$(node --input-type=module --eval 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "release/khie-mobile-${RELEASE_VERSION}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/khie-mobile-${RELEASE_VERSION}-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/release/app-x86-release.apk "release/khie-mobile-${RELEASE_VERSION}-x86.apk"
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk "release/khie-mobile-${RELEASE_VERSION}-x86_64.apk"
          cp android/app/build/outputs/apk/release/app-universal-release.apk "release/khie-mobile-${RELEASE_VERSION}-universal.apk"
          cd release
          sha256sum -- *.apk > "khie-mobile-${RELEASE_VERSION}.sha256"
          printf '%s  Khie Wallet Android signing certificate SHA-256\n' "$KHIE_SIGNING_CERT_SHA256" > "khie-mobile-${RELEASE_VERSION}.certificate.sha256"

      - name: Build commit list since previous release
        run: |
          set -euo pipefail
          # Previous release tag = most recent tag that is a strict ancestor of HEAD
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "${PREV_TAG:-}" ]; then
            echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
            LIST=$(git log --pretty=format:'  - %h %s' "${PREV_TAG}..${GITHUB_SHA}" | sed '/^$/d')
            if [ -z "${LIST:-}" ]; then
              LIST="  (no commits since ${PREV_TAG})"
            fi
            SECTION="## Commits since ${PREV_TAG}"
          else
            SECTION="## Commits"
            LIST="  (no previous release tag found)"
          fi
          BODY_SECTION="${SECTION}
${LIST}"
          # Multi-line env var via heredoc marker
          echo "COMMIT_SECTION<<EOMARK" >> "$GITHUB_ENV"
          printf '%s\n' "${BODY_SECTION}" >> "$GITHUB_ENV"
          echo "EOMARK" >> "$GITHUB_ENV"
          echo "--- commit section ---"
          printf '%s\n' "${BODY_SECTION}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Khie Wallet ${{ env.RELEASE_VERSION }}
          body: |
            Android standalone APK generated from `${{ github.sha }}`.

            ${{ env.COMMIT_SECTION }}

            - `arm64-v8a`: current Android phones and tablets
            - `armeabi-v7a`: older 32-bit ARM devices
            - `x86`: older 32-bit Android emulators and Intel devices
            - `x86_64`: Android emulators and Intel devices
            - `universal`: all four Android architectures, including 32-bit `x86`

            Android signing certificate SHA-256: `${{ env.KHIE_SIGNING_CERT_SHA256 }}`

            This application and its source code were generated entirely by AI, has not been independently security audited, and is not a production wallet. Understand the private-key, transaction-signing and asset risks before installing or using it.
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/khie-mobile-${{ env.RELEASE_VERSION }}-arm64-v8a.apk
            release/khie-mobile-${{ env.RELEASE_VERSION }}-armeabi-v7a.apk
            release/khie-mobile-${{ env.RELEASE_VERSION }}-x86.apk
            release/khie-mobile-${{ env.RELEASE_VERSION }}-x86_64.apk
            release/khie-mobile-${{ env.RELEASE_VERSION }}-universal.apk
            release/khie-mobile-${{ env.RELEASE_VERSION }}.sha256
            release/khie-mobile-${{ env.RELEASE_VERSION }}.certificate.sha256
