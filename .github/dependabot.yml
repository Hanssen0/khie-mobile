version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    target-branch: dev
    commit-message:
      prefix: chore(deps)
    # Expo SDK 57 owns the supported React/React Native pair. Upgrade either
    # only together with an Expo SDK migration, not through a grouped update.
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
