plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.khie.wallet'
version = '0.1.0'

android {
  namespace 'expo.modules.trustwallet'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Own the GATT operation queue instead of coordinating callbacks with wait/notify.
  implementation 'no.nordicsemi.android:ble:2.11.0'
}
